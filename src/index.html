<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e19" id="meta-theme-color">
  <script>
    (function () {
      try {
        var k = 'portfolio-theme';
        var t = localStorage.getItem(k);
        var root = document.documentElement;
        if (t === 'dark' || t === 'light') {
          root.setAttribute('data-theme', t);
          root.classList.toggle('dark', t === 'dark');
        } else {
          /* Default before Angular boots: dark (no OS theme auto-match). */
          root.setAttribute('data-theme', 'dark');
          root.classList.add('dark');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>

  <title>Hazem Abdullah Al-Yaari - Portfolio</title>
  <link rel="shortcut icon" href="favicon.ico">
  <meta name="title" content="Hazem Abdullah Al-Yaari - Portfolio">
  <meta name="description"
    content="Hazem Abdullah Al-Yaari is a .NET Full Stack Developer specializing in ASP.NET Core and Angular. Author of npm packages data-grid-angular and hijiri-calendar, and contributor to the Angular open-source ecosystem.">
  <meta name="keywords"
    content="Hazem Abdullah Al-Yaari, Hazem Al-Yaari, Full Stack Developer, .NET Developer, ASP.NET Core, Angular, npm, Open Source, data-grid-angular, hijiri-calendar, Portfolio, Sana'a Yemen" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- reCAPTCHA (explicit render from contact.component.ts) -->

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.emailjs.com/sdk/3.2.0/email.min.js"></script>
</head>
